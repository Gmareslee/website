backend:
  name: github
  repo: Gmareslee/website
  branch: main

media_folder: "images/models"
public_folder: "images/models"

collections:
  - name: "katalog"
    label: "Ürün Kataloğu"
    folder: "content/katalog"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Ürün/Kumaş Adı", name: "title", widget: "string"}
      - {label: "Açıklama", name: "description", widget: "text"}
      - {label: "Ürün Görseli", name: "image", widget: "image"}
