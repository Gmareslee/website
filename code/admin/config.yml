backend:
  name: github
  repo: Gmareslee/website

media_folder: "images"
public_folder: "/images"

collections:
  - name: "katalog"
    label: "Katalog"
    folder: "code/content/katalog" # senin markdownların nerede duruyorsa
    create: true
    fields:
      - {label: "Başlık", name: "title", widget: "string"}
      - {label: "Açıklama", name: "description", widget: "text", required: false}
      - {label: "Görsel", name: "image", widget: "image", media_folder: "code/images", public_folder: "/images"}
      

    # İŞTE KRİTİK KISIM BURASI:
    media_folder: ""       # Görselin proje içinde nereye kaydedileceği
    public_folder: ""      # Sitede yolun nasıl gösterileceği
