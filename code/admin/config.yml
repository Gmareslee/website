backend:
  name: git-gateway
  branch: main

site_url: https://krvltekstil.netlify.app
display_url: https://krvltekstil.netlify.app

media_folder: "images"
public_folder: "/images"

collections:
  - name: "katalog"
    label: "Katalog"
    folder: "content/katalog"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Başlık", name: "title", widget: "string"}
      - {label: "Açıklama", name: "description", widget: "text", required: false}
      - {label: "Görsel", name: "image", widget: "image"}
