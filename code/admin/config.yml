backend:
  name: github
  repo: Gmareslee/website
  branch: main
  base_url: https://cold-bush-6584.maresleexd.workers.dev
  auth_endpoint: /auth

media_folder: "code/images"
public_folder: "/images"

collections:
  - name: "catalog"
    label: "Katalog / Modeller"
    folder: "code/content/katalog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Başlık", name: "title", widget: "string" }
      - { label: "Ürün Görseli", name: "image", widget: "image" }
      - { label: "Açıklama", name: "description", widget: "text" }

