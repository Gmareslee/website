backend:
  name: git-gateway
  branch: main # ya da master

media_folder: "assets/images/katalog" # Yüklenen resimlerin gideceği klasör
public_folder: "/assets/images/katalog"

collections:
  - name: "katalog"
    label: "Ürün Kataloğu"
    folder: "content/katalog"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Ürün/Kumaş Adı", name: "title", widget: "string"}
      - {label: "Açıklama", name: "description", widget: "text"}
      - {label: "Ürün Görseli", name: "image", widget: "image"}