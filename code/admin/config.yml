backend:
  name: github
  repo: kullaniciadi/repoadi

media_folder: "images"    # Bilgisayardan yüklenen fotoğrafların gideceği ana klasör
public_folder: "/images"   # Sitede çağrılırken başına eklenecek yol

collections:
  - name: "models" # Artık senin koleksiyonun adı neyse
    label: "Modeller"
    folder: "content/models"
    create: true
    fields:
      - {label: "Başlık", name: "title", widget: "string"}
      - {label: "Açıklama", name: "description", widget: "text", required: false}
      - label: "Görsel"
        name: "image"
        widget: "image"
        media_library:
          config:
            max_file_size: 5120000 # İsteğe bağlı boyut sınırı
    # İŞTE KRİTİK KISIM BURASI:
    media_folder: ""       # Görselin proje içinde nereye kaydedileceği
    public_folder: ""      # Sitede yolun nasıl gösterileceği
