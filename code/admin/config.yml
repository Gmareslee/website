backend:
  name: github
  repo: Gmareslee/Website
  branch: main

# Dosyaların fiziksel olarak GitHub'da kaydedileceği yer (code klasörünün içi)
media_folder: "code/images"

# Sitenin ön yüzünde tarayıcının okuyacağı public yol
public_folder: "/images"

collections:
  - name: "katalog"
    label: "Katalog"
    folder: "code/content/katalog"
    create: true
    fields:
      - {label: "Başlık", name: "title", widget: "string"}
      - {label: "Açıklama", name: "description", widget: "text", required: false}
      - {label: "Görsel", name: "image", widget: "image"}
